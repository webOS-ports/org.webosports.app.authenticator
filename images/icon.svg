<?xml version="1.0" encoding="UTF-8"?>
<!-- Authenticator's icon: a padlock inside a countdown ring.
     Copyright 2026 Herman van Hazendonk <github.com@herrie.org>
     SPDX-License-Identifier: Apache-2.0
     tools/make-icon.sh renders it to icon.png and icon-256x256.png. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8fc8"/>
      <stop offset="1" stop-color="#1c5582"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe8ef"/>
    </linearGradient>
  </defs>
  <!-- The face, with a darker rim. -->
  <circle cx="128" cy="128" r="118" fill="url(#face)" stroke="#123c5c" stroke-width="4"/>
  <!-- The ring: the track, and three quarters of the time left on it,
       from the top, clockwise. -->
  <circle cx="128" cy="128" r="94" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="14"/>
  <path d="M 128 34 A 94 94 0 1 1 34 128" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <!-- The padlock. -->
  <path d="M 100 116 L 100 96 A 28 28 0 0 1 156 96 L 156 116" fill="none" stroke="#ffffff" stroke-width="14"/>
  <rect x="82" y="112" width="92" height="72" rx="10" ry="10" fill="url(#body)"/>
  <circle cx="128" cy="140" r="10" fill="#1c5582"/>
  <rect x="123" y="142" width="10" height="22" rx="4" ry="4" fill="#1c5582"/>
</svg>
